  <polygon points="44,33 36,34 38,38 43,37" fill="#4DA3FF" stroke="#000000" stroke-width="1" />
  <circle cx="24.5" cy="35.5" r="1.3" fill="#F4D35E" />
  <circle cx="39.5" cy="35.5" r="1.3" fill="#F4D35E" />
  
  <!-- Hocico y Colmillos -->
  <polygon points="27,42 37,42 35,48 29,48" fill="#000000" />
  <polygon points="28,42 30,46 29,42" fill="#FFFFFF" />
  <polygon points="36,42 34,46 35,42" fill="#FFFFFF" />
  
  <!-- Bigotes / Llamas Térmicas -->
