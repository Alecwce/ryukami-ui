  <rect x="2" y="2" width="60" height="60" fill="#D62436" stroke="#000000" stroke-width="3" />
  
  <!-- Cuernos Superiores del Dragón Scorch -->
  <path d="M10 8 L22 22 L18 24 L6 16 Z" fill="#000000" />
  <path d="M12 11 L20 21 L17 23 L9 16 Z" fill="#F4D35E" />
  <path d="M54 8 L42 22 L46 24 L58 16 Z" fill="#000000" />
  <path d="M52 11 L44 21 L47 23 L55 16 Z" fill="#F4D35E" />
  
