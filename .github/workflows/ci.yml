name: 🐉 CI // Security & Build Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: AppSec Tests (node:test) & Astro 7.4 Performance Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AppSec & Supply Chain Tests (node:test)
        run: pnpm test

      - name: Build registry & static site with timings
        run: pnpm run build:perf

      - name: Verify static production artifacts
        run: |
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
          test -f dist/404.html || (echo "Missing dist/404.html" && exit 1)
          test -f dist/favicon.svg || (echo "Missing dist/favicon.svg" && exit 1)
          test -f dist/robots.txt || (echo "Missing dist/robots.txt" && exit 1)
          test -f dist/sitemap.xml || (echo "Missing dist/sitemap.xml" && exit 1)
          test -f dist/llms.txt || (echo "Missing dist/llms.txt" && exit 1)
          test -f dist/r/registry.json || (echo "Missing dist/r/registry.json" && exit 1)
          echo "✅ All security tests passed and production artifacts verified!"
